---
# The template platform supports sensors which get their values from other
# entities.
#
# https://www.home-assistant.io/integrations/template/
#
switch:
  - name: Workstation
    unique_id: workstation_switch
    availability: '{{ has_value("binary_sensor.workstation_connected") }}'
    icon: mdi:laptop
    state: |
      {{ is_state("binary_sensor.workstation_connected", "on") }}
    turn_on:
      action: wake_on_lan.send_magic_packet
      data:
        mac: !secret wol_workstation_mac
    turn_off:
      action: button.press
      data: {}
      target:
        entity_id: button.workstation_shutdown
