---
# The template integration allows creating entities which derive their values
# from other data. This is done by specifying templates for properties of an
# entity, like the name or the state.
#
# https://www.home-assistant.io/integrations/template/
#
# This binary sensor is used to determine if the basement bath fan is turned on
#
trigger:
  - trigger: numeric_state
    entity_id: sensor.water_softener_salt_monitor_salt_level
    below: 15
    for:
      hours: 12
  - trigger: numeric_state
    entity_id: sensor.water_softener_salt_monitor_salt_level
    above: 15
binary_sensor:
  - name: Water Softener Salt Low
    unique_id: water_softener_salt_low
    device_class: problem
    icon: mdi:shaker-outline
    state: >-
      {{ states('sensor.water_softener_salt_monitor_salt_level') | float(100) < 15 }}
