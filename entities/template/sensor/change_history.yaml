---
# The template platform supports sensors which get their values from other
# entities.
#
# https://www.home-assistant.io/integrations/template/
#
# Example: {{ state_attr("sensor.nominal_change_history", "changes")["input_boolean.test"] | as_datetime }}
#
trigger:
  - trigger: state
    entity_id:
      - binary_sensor.doorbell_motion
      - binary_sensor.doorbell_person
      - binary_sensor.doorbell_visitor

      - binary_sensor.cold_storage_door_contact
      - binary_sensor.front_door_contact
      - binary_sensor.garage_entry_contact
      - binary_sensor.garage_side_door_contact
      - binary_sensor.sliding_door_contact

      - binary_sensor.kitchen_window_contact
      - binary_sensor.living_room_left_window_contact
      # - binary_sensor.living_room_right_window_contact
      - binary_sensor.joshua_office_window_contact
      - binary_sensor.main_bedroom_window_contact
      # - binary_sensor.main_bathroom_window_contact
      # - binary_sensor.amy_office_window_contact
      # - binary_sensor.emma_bedroom_window_contact
      # - binary_sensor.ethan_bedroom_window_contact
      # - binary_sensor.family_room_left_window_contact
      # - binary_sensor.family_room_right_window_contact
      # - binary_sensor.theater_room_window_contact

      - binary_sensor.lantea_mover_active
      - binary_sensor.lantea_parity_check_running
      - cover.garage_door
      - input_boolean.dryer_status
      - input_boolean.washer_status
      - sensor.external_ip
    not_to:
      - unavailable
      - unknown
    not_from:
      - unavailable
      - unknown
sensor:
  - name: Nominal Change History
    state: "OK"
    attributes:
      changes: >
        {% set current = this.attributes.get('changes', {}) %}
        {% if not trigger.to_state in ['unknown', 'unavailable', none]
          and not trigger.to_state.last_changed in ['unknown', 'unavailable', none] %}
          {% set new = {trigger.entity_id: trigger.to_state.last_changed.isoformat()} %}
          {{ dict(current, **new) }}
        {% else %}
          {{ current }}
        {% endif %}
