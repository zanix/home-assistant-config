  editor:
    - type: constant
      label: >-
        One entry per thing you want to change: the main icon, a sub-button or the
        whole card (pick it as Target). Only Name and Target are required — every
        other option is grouped into collapsible sections, and sections that don't
        apply to the chosen target stay hidden. Badges are small overlay chips and
        live in their own list below.
    - type: heading
      heading: Entries
    - name: icons
      label: Entries (icon / sub-button / whole card)
      selector:
        object:
          fields:
            # ── Entry basics ──
            name:
              label: Override Name
              description: >-
                Unique name for this icon override (e.g., thermostat_mode,
                light_status)
              required: true
              selector:
                text: {}
            target:
              label: Target Container
              description: Which icon to override
              default: main_icon
              required: true
              selector:
                select:
                  options:
                    - label: Main Icon
                      value: main_icon
                    - label: Sub-button 1
                      value: button_1
                    - label: Sub-button 2
                      value: button_2
                    - label: Sub-button 3
                      value: button_3
                    - label: Sub-button 4
                      value: button_4
                    - label: Whole Card (border/glow/background/filter)
                      value: card
                  multiple: false
                  custom_value: false
                  mode: "dropdown"
            targets:
              label: Multiple Targets
              description: "List of targets this config applies to (overrides Target), e.g. [button_1, button_2]."
              selector:
                object: {}
            entity:
              label: Entity
              description: Entity to monitor for state changes
              warn_if: "item.entity && hass && !hass.states[item.entity]"
              warn_text: Entity not found in Home Assistant.
              selector:
                entity: {}
            secondary_entity:
              label: Secondary Entity
              description: Exposes secondary / secondaryState / secondaryAttributes in expressions for cross-entity logic.
              warn_if: "item.secondary_entity && hass && !hass.states[item.secondary_entity]"
              warn_text: Entity not found in Home Assistant.
              selector:
                entity: {}
            state_attribute:
              label: State Attribute
              description: "Attribute used as `state` for this entry — every *_map, *_thresholds, condition_js and cond(state, ...) keys on it instead of the entity state. On a `card` target with no card_state* set, the state line shows this attribute. Example: hvac_action."
              warn_if: "item.state_attribute && hass && hass.states[item.entity || (card && card.entity)] && !(item.state_attribute in hass.states[item.entity || (card && card.entity)].attributes)"
              warn_text: The entity has no such attribute.
              selector:
                attribute: {}
            # ── Visibility ──
            conditions:
              label: Display Conditions
              description: Only apply icon override when these conditions are met
              selector:
                condition: {}
            condition_js:
              label: Visibility Expression (JavaScript)
              description: "JS gate ANDed with Display Conditions, e.g. state === 'on' && heldFor('switch.pump', 300). Errors hide the config."
              selector:
                text:
                  multiline: true
            hide:
              label: Hide Sub-Button
              description: Hide the targeted sub-button entirely while this entry's conditions match.
              selector:
                boolean: {}
            # ── Icon ──
            icon:
              label: Static Icon
              description: Fixed icon to use (use icon_js for dynamic icons)
              selector:
                icon: {}
            icon_js:
              label: Dynamic Icon (JavaScript)
              description: "JavaScript expression for dynamic icon selection. Example: state === \"heating\" ? \"mdi:fire\" : \"mdi:thermostat\""
              selector:
                text:
                  multiline: true
            icon_map:
              label: "Icon Map (state -> icon)"
              description: "Declarative state->icon map, e.g. {cool: mdi:snowflake, '*': mdi:thermostat}. '*' = fallback."
              selector:
                object: {}
            icon_thresholds:
              label: Icon Thresholds (numeric)
              description: "[[min, icon], ...] — highest stop <= the numeric state wins, e.g. [[0, mdi:battery-alert], [60, mdi:battery]]."
              selector:
                object: {}
            # ── Icon color ──
            icon_color:
              label: Icon Color
              description: "Static color for the icon. attr:KEY reads an entity attribute (attr:rgb_color syncs to a light's colour; [r,g,b] arrays auto-convert)."
              selector:
                ui_color: {}
            icon_color_js:
              label: Dynamic Icon Color (JavaScript)
              description: "JavaScript expression for color. Example: state === \"on\" ? \"#ffc107\" : \"#666\""
              selector:
                text:
                  multiline: true
            icon_color_map:
              label: "Icon Color Map (state -> color)"
              description: "Declarative state->color map; '*' = fallback."
              selector:
                object: {}
            icon_color_thresholds:
              label: Icon Color Thresholds (numeric)
              description: "[[min, color], ...] — highest stop <= the numeric state wins. e.g. [[0, green], [30, orange], [60, red]]. Priority: _js > _map > _thresholds > static."
              selector:
                object: {}
            # ── Opacity / transform / filter ──
            icon_opacity:
              label: Icon Opacity
              description: Opacity for the icon glyph / entity picture only (0.0 to 1.0); background keeps its own.
              selector:
                number:
                  min: 0
                  max: 1
                  step: 0.05
                  mode: slider
            icon_opacity_js:
              label: Dynamic Icon Opacity (JavaScript)
              description: "JavaScript expression for the icon glyph's opacity. Example: state === \"on\" ? 1 : 0.4"
              selector:
                text:
                  multiline: true
            icon_opacity_map:
              label: "Icon Opacity Map (state -> opacity)"
              description: "Declarative state->opacity map, e.g. {on: 1, off: 0.4, '*': 0.7}."
              selector:
                object: {}
            icon_opacity_thresholds:
              label: Icon Opacity Thresholds (numeric)
              description: "[[min, opacity], ...] — e.g. [[0, 0.3], [50, 1]]."
              selector:
                object: {}
            rotate:
              label: Icon Rotation (degrees)
              description: Rotate the icon glyph/picture; composes with animation effects.
              selector:
                number:
                  min: -360
                  max: 360
                  step: 1
                  mode: box
            rotate_js:
              label: Dynamic Rotation (JavaScript)
              description: "JS expression returning degrees, e.g. attr('weather.home','wind_bearing')."
              selector:
                text:
                  multiline: true
            filter:
              label: CSS Filter
              description: >-
                CSS filter on the icon/entity picture, e.g. grayscale(1),
                blur(2px), sepia(0.5) brightness(0.8). Bare keyword like
                "grayscale" expands to grayscale(1). Combine with conditions to
                e.g. grey out a person photo when away. Pick any number of
                presets and/or type your own — they chain into one filter.
              selector:
                select:
                  custom_value: true
                  multiple: true
                  mode: dropdown
                  options:
                    - grayscale(1)
                    - blur(2px)
                    - sepia(0.6)
                    - brightness(0.7)
                    - brightness(1.3)
                    - saturate(0.3)
                    - saturate(2)
                    - invert(1)
                    - contrast(1.5)
                    - hue-rotate(90deg)
                    - drop-shadow(0 0 6px currentColor)
            filter_js:
              label: CSS Filter Expression (JS)
              description: "JS expression returning a CSS filter string, e.g. state === 'not_home' ? 'grayscale(1)' : 'none'. Overrides Filter."
              selector:
                text:
                  multiline: true
            filter_map:
              label: "Filter Map (state -> CSS filter)"
              description: "Declarative state->filter map, e.g. {not_home: grayscale(100%), '*': ''}. '*' = fallback."
              selector:
                object: {}
            filter_thresholds:
              label: Filter Thresholds
              description: "Numeric stops [[min, filter], ...], highest stop <= state wins."
              selector:
                object: {}
            # ── Background ──
            background_color:
              label: Background Color
              description: Static background color for the icon container
              selector:
                ui_color: {}
            background_color_js:
              label: Dynamic Background Color (JavaScript)
              description: "JavaScript expression for background. Example: state === \"heating\" ? \"#ff000030\" : null"
              selector:
                text:
                  multiline: true
            background_color_map:
              label: "Background Color Map (state -> color)"
              description: "Declarative state->background map; '*' = fallback."
              selector:
                object: {}
            background_color_thresholds:
              label: Background Color Thresholds (numeric)
              description: "[[min, color], ...] applied to the background by numeric state."
              selector:
                object: {}
            background_opacity:
              label: Background Opacity
              description: Opacity for the background (0.0 to 1.0)
              selector:
                number:
                  min: 0
                  max: 1
                  step: 0.05
                  mode: slider
            background_opacity_js:
              label: Dynamic Background Opacity (JavaScript)
              description: "JavaScript expression for opacity. Example: state === \"on\" ? 0.8 : 0.3"
              selector:
                text:
                  multiline: true
            auto_contrast:
              label: Auto-contrast Foreground
              description: "Derive a readable black/white icon+text colour from the background — icon glyph, text-as-icon, sub-button tiles, and on target: card the name/state lines. Any CSS colour works, including theme names and var(--...), resolved against the live theme."
              selector:
                boolean: {}
            # ── Text as icon + value formatting ──
            text:
              label: Text (instead of icon)
              description: >-
                Show this static text in place of the icon glyph (e.g. "Auto").
                For dynamic values use Text Expression or Attribute below.
                Works on the Main Icon and sub-button targets.
              selector:
                text: {}
            text_js:
              label: Text Expression (JS)
              description: "JS expression returning the text to display, e.g. attr('climate.living','current_temperature').toFixed(1) + '°'. Overrides Text and Attribute. Works on the Main Icon and sub-button targets."
              selector:
                text:
                  multiline: true
            text_map:
              label: "Text Map (state -> text)"
              description: "Declarative state->text map for text-as-icon, e.g. {eco: ECO, '*': '?'}. '*' = fallback."
              selector:
                object: {}
            text_thresholds:
              label: Text Thresholds
              description: "Numeric stops [[min, text], ...] for text-as-icon."
              selector:
                object: {}
            attribute:
              label: Attribute as Text
              description: >-
                Display this entity attribute as the icon text (e.g.
                current_temperature). Use "state" for the entity state.
                Combine with Decimals / Prefix / Suffix. Works on the Main
                Icon and sub-button targets.
              warn_if: "item.attribute && item.attribute !== 'state' && hass && hass.states[item.entity || (card && card.entity)] && !(item.attribute in hass.states[item.entity || (card && card.entity)].attributes)"
              warn_text: The entity has no such attribute.
              selector:
                attribute: {}
            decimals:
              label: Decimals
              description: Round the Attribute value to this many decimal places
              selector:
                number:
                  min: 0
                  max: 4
                  step: 1
                  mode: box
            format:
              label: Value Format
              description: Format numeric text — duration (minutes to "1h 5m"), clock (minutes-from-now to "14:05"), percent, or power (W, >=1000 auto-scales to kW). Empty = value shown as-is.
              selector:
                select:
                  mode: dropdown
                  options:
                    - duration
                    - clock
                    - percent
                    - power
            multiply:
              label: Multiply value
              description: Scale numeric text/label values (e.g. 100 to turn a 0..1 fraction into a percent).
              selector:
                number:
                  mode: box
            prefix:
              label: Text Prefix
              description: Prepended to the Attribute value (e.g. "$")
              selector:
                text: {}
            suffix:
              label: Text Suffix
              description: Appended to the Attribute value (e.g. "°" or " %")
              selector:
                text: {}
            pair_attribute:
              label: Pair Attribute
              description: A second attribute joined to the value (e.g. current/target temperature).
              warn_if: "item.pair_attribute && (!item.attribute || (item.pair_attribute !== 'state' && hass && hass.states[item.entity || (card && card.entity)] && !(item.pair_attribute in hass.states[item.entity || (card && card.entity)].attributes)))"
              warn_text: Needs Attribute as Text set, and must be an attribute of the entity (or "state").
              selector:
                attribute: {}
            animate_value:
              label: Animate Value Changes
              description: Roll the displayed numeric value old -> new (400ms) on text-as-icon and sub-button labels.
              selector:
                boolean: {}
            flash_on_change:
              label: Flash on Change
              description: One-shot pulse on the displayed text/label when its value changes.
              selector:
                boolean: {}
            # ── Sub-button value/label ──
            label_value:
              label: Sub-button Value (static)
              description: Value rendered into the sub-button name line (replaces native text).
              selector:
                text: {}
            label_value_js:
              label: Sub-button Value Expression (JS)
              description: "JS expression for the sub-button value, e.g. Math.round(parseFloat(state))+'%'."
              selector:
                text:
                  multiline: true
            label_attribute:
              label: Sub-button Value from Attribute
              description: Use an entity attribute as the value (honours Decimals/Format/Multiply/Prefix/Suffix).
              warn_if: "item.label_attribute && item.label_attribute !== 'state' && hass && hass.states[item.entity || (card && card.entity)] && !(item.label_attribute in hass.states[item.entity || (card && card.entity)].attributes)"
              warn_text: The entity has no such attribute.
              selector:
                attribute: {}
            label:
              label: Sub-button Label
              description: Static label shown with the value (e.g. "ETA").
              selector:
                text: {}
            two_column:
              label: Two-column value/label
              description: Lay the value (left) and label (right) out as a grid.
              selector:
                boolean: {}
            # ── Card text (target: card) ──
            card_name:
              label: "Card Name Override (target: card)"
              description: Replaces the card's name line. Reverts to Bubble's own name when this entry's conditions stop matching.
              selector:
                text: {}
            card_name_js:
              label: Dynamic Card Name (JavaScript)
              description: "JavaScript expression for the name line. Example: attributes.friendly_name + ' • ' + timeAgo(entity.last_changed)"
              selector:
                text:
                  multiline: true
            card_name_map:
              label: "Card Name Map (state -> text)"
              description: "Declarative state->name map; '*' = fallback."
              selector:
                object: {}
            card_name_thresholds:
              label: Card Name Thresholds (numeric)
              description: "[[min, text], ...] — highest stop <= the numeric state wins."
              selector:
                object: {}
            card_state:
              label: "Card State Override (target: card)"
              description: "Replaces the card's state/subtitle line (and unhides it). Long text scrolls like Bubble's own; a list or embedded newlines render multi-line — size the card with card_layout: large + rows: N."
              selector:
                text: {}
            card_state_js:
              label: Dynamic Card State (JavaScript)
              description: "JavaScript expression for the state line. Return a string, or an array for multiple lines. Example: [state + ' °C', attributes.hvac_action]"
              selector:
                text:
                  multiline: true
            card_state_map:
              label: "Card State Map (state -> text)"
              description: "Declarative state->subtitle map; '*' = fallback."
              selector:
                object: {}
            card_state_thresholds:
              label: Card State Thresholds (numeric)
              description: "[[min, text], ...] — e.g. [[0, 'low'], [50, 'high']]."
              selector:
                object: {}
            card_state_parts:
              label: "Card State Parts (target: card)"
              description: "List of named value parts composing the state line, each independently formatted and coloured. Beats the card_state/_js/_map/_thresholds chain when any part has a value. Part fields: name (required, referenced as {name} in card_state_format), entity (default = card entity), attribute (omit or 'state' = entity state), decimals/format/multiply/prefix/suffix, text_color + _js/_map/_thresholds and background_color + _js/_map/_thresholds (background renders as an inline chip; variants key on the part's RAW value), condition_js. With auto_contrast on the entry, a part with only a background derives a readable text colour."
              selector:
                object: {}
            card_state_format:
              label: Card State Format (template)
              description: "Layout template for card_state_parts: '{temp}° · H {hum}% — {action}'. {name} inserts that part's coloured value; literal text stays in the base text colour; {{ and }} escape braces; embedded newlines render multi-line. Omit to join parts with card_state_separator."
              selector:
                text: {}
            card_state_separator:
              label: Card State Separator
              description: Joiner between parts when card_state_format is not set.
              default: " · "
              selector:
                text: {}
            text_color:
              label: Card Text Color (target card)
              description: "Foreground colour for the card's name/state lines (target: card). attr:KEY supported. Or set Auto Contrast to derive it from the card background."
              selector:
                ui_color: {}
            text_color_js:
              label: Dynamic Card Text Color (JavaScript)
              description: "JS expression returning the card name/state colour (target: card)."
              selector:
                text:
                  multiline: true
            text_color_map:
              label: "Card Text Color Map (state -> color)"
              description: "Declarative state->colour map for the card's name/state lines, e.g. {on: '#fff', '*': ''}."
              selector:
                object: {}
            text_color_thresholds:
              label: Card Text Color Thresholds
              description: "Numeric stops [[min, color], ...] for the card's name/state lines."
              selector:
                object: {}
            # ── Card styling (target: card) ──
            border_color:
              label: Card Border Color
              description: "2px card border (target: card only)."
              selector:
                ui_color: {}
            border_color_js:
              label: Dynamic Card Border Color (JavaScript)
              description: "JS expression for the card border color (target: card only)."
              selector:
                text:
                  multiline: true
            glow_color:
              label: Card Glow Color
              description: "Card box-shadow glow color (target: card only)."
              selector:
                ui_color: {}
            glow_color_js:
              label: Dynamic Card Glow Color (JavaScript)
              description: "JS expression for the card glow color (target: card only)."
              selector:
                text:
                  multiline: true
            accent_color:
              label: Card Accent Color
              description: "Edge accent stripe color (target: card only)."
              selector:
                ui_color: {}
            accent_color_js:
              label: Dynamic Card Accent Color (JavaScript)
              description: "JS expression for the accent stripe color (target: card only)."
              selector:
                text:
                  multiline: true
            accent_color_map:
              label: "Card Accent Color Map (state -> color)"
              description: "e.g. {home: '#4caf50', not_home: '#f44336', '*': '#2196f3'} (target: card only)."
              selector:
                object: {}
            accent_color_thresholds:
              label: Card Accent Color Thresholds (numeric)
              description: "[[min, color], ...] applied to the accent stripe by numeric state (target: card only)."
              selector:
                object: {}
            accent_side:
              label: Accent Side
              description: Which card edge gets the accent stripe.
              default: left
              selector:
                select:
                  options: [left, right, top, bottom]
                  mode: dropdown
            accent_width:
              label: Accent Width (px)
              description: Accent stripe thickness (default 4).
              selector:
                number:
                  min: 1
                  step: 1
                  mode: box
            background_image:
              label: Card Background Image
              description: "Image URL or attr:KEY (e.g. attr:entity_picture) as the card background (target: card only)."
              selector:
                text: {}
            background_image_js:
              label: Dynamic Card Background Image (JavaScript)
              description: "JS expression returning an image URL (target: card only)."
              selector:
                text:
                  multiline: true
            background_blur:
              label: Background Image Blur (px)
              description: Blur radius for the card background image.
              selector:
                number:
                  min: 0
                  step: 1
                  mode: box
            background_dim:
              label: Background Image Dim (0-1)
              description: Darken the card background image (0 = none, 1 = black).
              selector:
                number:
                  min: 0
                  max: 1
                  step: 0.05
                  mode: slider
            # ── Progress (ring / bar / fill) ──
            progress:
              label: Progress Ring (0-100, "timer" or "attr:KEY")
              description: "Conic progress ring around the icon (main_icon / round sub-buttons; bottom bar on target: card). The word timer derives live progress from a timer entity; attr:brightness reads an attribute (pair with Progress Max, e.g. 255)."
              selector:
                text: {}
            progress_js:
              label: Dynamic Progress (JavaScript)
              description: "JS expression returning 0-100, e.g. parseFloat(states('sensor.print_progress')). Or set Progress Ring to the word timer for a live timer-entity ring."
              selector:
                text:
                  multiline: true
            progress_style:
              label: Progress Style (card / sub-button)
              description: "On target: card and button_N. Empty/\"bar\" = bottom-edge bar on the card, ring on sub-buttons; \"fill\" = the whole card or sub-button background fills along Progress Fill Direction."
              selector:
                select:
                  options:
                    - bar
                    - fill
                  mode: dropdown
            progress_min:
              label: Progress Min
              description: "Sensor value that maps to 0% (default 0)."
              selector:
                number:
                  step: any
                  mode: box
            progress_max:
              label: Progress Max
              description: "Sensor value that maps to 100% (default 100). E.g. 255 for light brightness."
              selector:
                number:
                  step: any
                  mode: box
            progress_direction:
              label: Progress Fill Direction
              description: "Fill growth direction (fill style only)."
              default: right
              selector:
                select:
                  options: [right, left, up, down]
                  mode: dropdown
            progress_thickness:
              label: Progress Thickness (px)
              description: "Ring band width / bar height in px (default 3; sub-button rings 2.5)."
              selector:
                number:
                  step: 0.5
                  mode: box
            progress_color:
              label: Progress Ring Color
              description: "Ring color. \"auto\" follows the percentage red -> orange -> green. With card fill style, a CSS gradient string (e.g. linear-gradient(to right, #2196f3, #9c27b0)) paints a fixed-span gradient revealed by the fill."
              default: var(--primary-color)
              selector:
                select:
                  custom_value: true
                  multiple: false
                  mode: dropdown
                  options:
                    - label: Theme primary
                      value: var(--primary-color)
                    - label: Auto (red -> orange -> green by %)
                      value: auto
            # Declared before the _js variant on purpose: the runtime favours
            # stops over the JS variant, and the editor's mode dropdown defaults
            # to the first declared variant with data — order keeps the two agreeing.
            progress_color_stops:
              label: Progress Color Stops
              description: "Custom ramp for the progress color: From (progress %) / color rows, blended smoothly between stops. Any CSS color works — theme names, var(--x), named, rgb()/hsl(), hex. Takes precedence over the static and JavaScript modes."
              selector:
                object: {}
            progress_color_js:
              label: Dynamic Progress Color (JavaScript)
              description: "JS expression for the progress ring/bar color."
              selector:
                text:
                  multiline: true
            progress_track_color:
              label: Progress Track Color
              description: Color of the unfilled rest of the ring (default faint grey; for card fill style, the theme card background).
              selector:
                ui_color: {}
            # ── Sparkline ──
            sparkline:
              label: Sparkline
              description: "Ghost history chart along the card bottom (target: card) or as the sub-button background."
              selector:
                boolean: {}
            sparkline_entity:
              label: Sparkline Entity
              description: Chart a different entity's history (default = this entry's entity).
              selector:
                entity: {}
            sparkline_hours:
              label: Sparkline Hours
              description: History window in hours (default 24).
              selector:
                number:
                  min: 1
                  step: 1
                  mode: box
            sparkline_refresh:
              label: Sparkline Refresh
              description: "How often the history is re-fetched — seconds or a duration like 15m / 2h. Empty = auto: one chart bucket (window ÷ 60, at least 5 minutes); fetching faster than a bucket can't change the chart."
              selector:
                text: {}
            sparkline_style:
              label: Sparkline Style
              description: Area = flat fill under the curve. Gradient = fill fading to transparent toward the bottom. Line = stroke only, no fill (opacity defaults to 0.8 instead of 0.3).
              default: area
              selector:
                select:
                  options:
                    - label: Area
                      value: area
                    - label: Gradient fade
                      value: gradient
                    - label: Line
                      value: line
                  mode: dropdown
            sparkline_agg:
              label: Sparkline Aggregation
              description: Which value represents each chart bucket (the window is downsampled to 60). Average smooths spikes away; Max / Min preserve peaks / dips (power sensors); Last keeps the newest sample.
              default: mean
              selector:
                select:
                  options:
                    - label: Average
                      value: mean
                    - label: Max
                      value: max
                    - label: Min
                      value: min
                    - label: Last
                      value: last
                  mode: dropdown
            sparkline_smooth:
              label: Sparkline Smoothing
              description: Draw the history as a smooth curve instead of straight segments.
              selector:
                boolean: {}
            sparkline_color:
              label: Sparkline Color
              description: Chart color (default grey). Any CSS colour works — theme names and var(--...) are resolved to a concrete hex at render time. Legacy [r,g,b] values keep working.
              selector:
                ui_color: {}
            sparkline_height:
              label: Sparkline Height
              description: "How much of the card height the chart band occupies, in percent (default 35). 100 = full-height curves."
              selector:
                number:
                  min: 5
                  max: 100
                  step: 5
                  mode: slider
            sparkline_scale:
              label: Sparkline Scale
              description: "What the chart's y-range is. Own = the curve stretches to its own data min/max. Shared = one joint range across the card's shared curves (they stack as layers — one per entry), so where they sit and cross is comparable. Fixed = the Sparkline Min / Max values below."
              default: own
              selector:
                select:
                  options:
                    - label: Own range
                      value: own
                    - label: Shared range
                      value: shared
                    - label: Fixed range
                      value: fixed
                  mode: dropdown
            sparkline_min:
              label: Sparkline Min
              description: Bottom of the fixed y-range (e.g. 0 for percentages). Empty = the data's own minimum. Values below it flatten against the chart edge.
              selector:
                number:
                  step: any
                  mode: box
            sparkline_max:
              label: Sparkline Max
              description: Top of the fixed y-range (e.g. 100 for percentages). Empty = the data's own maximum. Values above it flatten against the chart edge.
              selector:
                number:
                  step: any
                  mode: box
            sparkline_opacity:
              label: Sparkline Opacity
              description: Fill opacity of the chart area (default 0.3; line style 0.8).
              selector:
                number:
                  min: 0
                  max: 1
                  step: 0.05
                  mode: slider
            # ── Animation ──
            effect:
              label: Animation Effect
              description: Static animation effect for the icon. Empty = no animation.
              selector:
                select:
                  options:
                    - label: Pulse (gentle scaling)
                      value: pulse
                    - label: Glow (soft light effect)
                      value: glow
                    - label: Rotate (gentle rocking)
                      value: rotate
                    - label: Spin (continuous rotation)
                      value: spin
                    - label: Float (up and down)
                      value: float
                    - label: Zoom (scaling animation)
                      value: zoom
                    - label: Shake (quick wiggle)
                      value: shake
                    - label: Vibrate (rapid shake)
                      value: vibrate
                    - label: Flip (3D flip effect)
                      value: flip
                    - label: Blink (on/off flashing)
                      value: blink
                  multiple: false
                  custom_value: false
                  mode: dropdown
            effect_js:
              label: Dynamic Effect (JavaScript)
              description: "JavaScript expression for effect. Example: state === \"heating\" ? \"pulse\" : null"
              selector:
                text:
                  multiline: true
            effect_map:
              label: "Effect Map (state -> effect)"
              description: "Declarative state->effect map; '*' = fallback."
              selector:
                object: {}
            effect_thresholds:
              label: Effect Thresholds (numeric)
              description: "[[min, effect], ...] — e.g. [[80, glow], [95, blink]]."
              selector:
                object: {}
            effect_speed:
              label: Effect Speed
              description: Animation speed multiplier (2 = twice as fast, 0.5 = half speed).
              selector:
                number:
                  min: 0.1
                  max: 5
                  step: 0.1
                  mode: box
            effect_speed_js:
              label: Dynamic Effect Speed (JavaScript)
              description: JS expression returning the speed multiplier.
              selector:
                text:
                  multiline: true
            effect_target:
              label: Animation Target
              description: >-
                Where to apply the animation effect. 'container' animates badges
                together with icon, 'icon' keeps badges static.
              default: container
              selector:
                select:
                  options:
                    - label: Container (badges animate with icon)
                      value: container
                    - label: Icon Only (badges stay static)
                      value: icon
                  multiple: false
                  custom_value: false
                  mode: "dropdown"
            effect_target_js:
              label: Dynamic Animation Target (JavaScript)
              description: "JavaScript expression for animation target. Example: state === \"active\" ? \"icon\" : \"container\""
              selector:
                text:
                  multiline: true
            animation:
              label: Raw CSS Animation
              description: >-
                Full CSS animation shorthand, e.g. "my-anim 1s infinite". Define
                the @keyframes in the card's styles block. Overrides Effect.
              warn_if: "item.animation && item.effect"
              warn_text: Raw CSS Animation overrides Animation Effect — Effect is ignored.
              selector:
                text: {}
            animation_js:
              label: Dynamic Raw Animation (JavaScript)
              description: JS expression returning a CSS animation shorthand.
              selector:
                text:
                  multiline: true
            # ── Freshness / availability ──
            stale_after:
              label: Stale After
              description: Grey out + "stale (Xm)" tooltip when last_updated is older than this. Seconds, or a duration like 30m / 2h / 1d.
              selector:
                text: {}
            unavailable_style:
              label: Unavailable Style
              description: Grey out + tooltip when entity is unavailable/unknown. "grey" = preset, or type any raw CSS filter. Empty = no unavailable styling.
              selector:
                select:
                  custom_value: true
                  multiple: false
                  mode: dropdown
                  options:
                    - label: Grey out (preset)
                      value: grey
                    - label: Blur + fade
                      value: blur(2px) opacity(0.6)
                    - label: Desaturate
                      value: saturate(0.2)
                    - label: Darken
                      value: brightness(0.5)
            # ── Advanced ──
            title:
              label: Tooltip
              description: Hover tooltip text on the icon / sub-button (desktop).
              selector:
                text: {}
            title_js:
              label: Dynamic Tooltip (JavaScript)
              description: JS expression returning the tooltip text.
              selector:
                text:
                  multiline: true
            css:
              label: Custom CSS
              description: "Raw CSS declarations applied to the target container (icon circle / sub-button / whole card), e.g. border: 2px dashed red;"
              selector:
                text:
                  multiline: true
            css_js:
              label: Dynamic Custom CSS (JavaScript)
              description: JS expression returning CSS declarations for the target container.
              selector:
                text:
                  multiline: true
          multiple: true
          label_field: name
          description_field: target
    - type: heading
      heading: Badge Overlays
    - name: badges
      label: Smart Badges
      selector:
        object:
          fields:
            # ── Badge basics ──
            name:
              label: Badge Name
              description: Unique name for this badge
              required: true
              selector:
                text: {}
            target:
              label: Target Container
              description: Where to place this badge (Whole Card = corner of the card; use positive offsets there)
              default: main_icon
              required: true
              selector:
                select:
                  options:
                    - label: Main Icon
                      value: main_icon
                    - label: Whole Card
                      value: card
                    - label: Sub-button 1
                      value: button_1
                    - label: Sub-button 2
                      value: button_2
                    - label: Sub-button 3
                      value: button_3
                    - label: Sub-button 4
                      value: button_4
                  multiple: false
                  custom_value: false
                  mode: "dropdown"
            targets:
              label: Multiple Targets
              description: "List of targets this badge applies to (overrides Target)."
              selector:
                object: {}
            entity:
              label: Entity
              description: Entity to monitor and display (use this OR icon, not both)
              warn_if: "item.entity && hass && !hass.states[item.entity]"
              warn_text: Entity not found in Home Assistant.
              selector:
                entity: {}
            attribute:
              label: Entity Attribute
              description: Specific attribute to display (leave empty to show entity state)
              warn_if: "item.attribute && hass && hass.states[item.entity || (card && card.entity)] && !(item.attribute in hass.states[item.entity || (card && card.entity)].attributes)"
              warn_text: The entity has no such attribute.
              selector:
                attribute: {}
            # ── Visibility ──
            conditions:
              label: Display Conditions
              description: Only show badge when these conditions are met
              selector:
                condition: {}
            condition_js:
              label: Visibility Expression (JavaScript)
              description: JS gate ANDed with Display Conditions. Errors hide the badge.
              selector:
                text:
                  multiline: true
            # ── Content + value formatting ──
            icon:
              label: Icon
              description: Static icon to display (use this OR entity, not both)
              selector:
                icon: {}
            icon_js:
              label: Dynamic Icon (JavaScript)
              description: JavaScript expression for dynamic icon
              selector:
                text:
                  multiline: true
            icon_map:
              label: "Icon Map (state -> icon)"
              description: "Declarative state->icon map; '*' = fallback."
              selector:
                object: {}
            icon_thresholds:
              label: Icon Thresholds (numeric)
              description: "[[min, icon], ...] — highest stop <= the numeric state wins."
              selector:
                object: {}
            text_js:
              label: Dynamic Text (JavaScript)
              description: JavaScript expression for dynamic text
              selector:
                text:
                  multiline: true
            text_map:
              label: Text Map (state -> text)
              description: "Declarative state->text map, e.g. {eco: ECO, '*': '?'}. '*' = fallback."
              selector:
                object: {}
            text_thresholds:
              label: Text Thresholds
              description: "Numeric stops [[min, text], ...], highest stop <= state wins."
              selector:
                object: {}
            show_entity_picture:
              label: Show Entity Picture
              description: Render the entity's picture as a round avatar badge (takes priority over icon/text).
              selector:
                boolean: {}
            decimals:
              label: Decimals
              description: Round the attribute value to this many decimal places
              selector:
                number:
                  min: 0
                  max: 4
                  step: 1
                  mode: box
            format:
              label: Value Format
              description: Format the attribute value — duration (minutes to "1h 5m"), clock (minutes-from-now to "14:05"), percent, or power (W, >=1000 auto-scales to kW). Empty = value shown as-is.
              selector:
                select:
                  mode: dropdown
                  options:
                    - duration
                    - clock
                    - percent
                    - power
            multiply:
              label: Multiply value
              description: Scale the numeric attribute value (e.g. 100 for a 0..1 fraction).
              selector:
                number:
                  mode: box
            prefix:
              label: Text Prefix
              description: Prepended to the attribute value
              selector:
                text: {}
            suffix:
              label: Text Suffix
              description: Appended to the attribute value (e.g. "°")
              selector:
                text: {}
            animate_value:
              label: Animate Value Changes
              description: Roll the displayed numeric badge value old -> new (400ms).
              selector:
                boolean: {}
            flash_on_change:
              label: Flash on Change
              description: One-shot pulse on the badge content when its value changes.
              selector:
                boolean: {}
            # ── Placement & shape ──
            position:
              label: Position
              description: Where to place the badge
              default: top-right
              required: true
              selector:
                select:
                  options:
                    - label: Top Left
                      value: top-left
                    - label: Top Center
                      value: top
                    - label: Top Right
                      value: top-right
                    - label: Bottom Left
                      value: bottom-left
                    - label: Bottom Center
                      value: bottom
                    - label: Bottom Right
                      value: bottom-right
                  multiple: false
                  custom_value: false
                  mode: "dropdown"
            position_js:
              label: Dynamic Position (JavaScript)
              description: JavaScript expression for position
              selector:
                text:
                  multiline: true
            shape:
              label: Shape
              description: Badge shape (auto detects based on content)
              default: auto
              required: true
              selector:
                select:
                  options:
                    - label: Auto (circle for icons, rounded for text)
                      value: auto
                    - label: Circle
                      value: circle
                    - label: Rounded Rectangle
                      value: rounded
                  multiple: false
                  custom_value: false
                  mode: "dropdown"
            shape_js:
              label: Dynamic Shape (JavaScript)
              description: JavaScript expression for shape
              selector:
                text:
                  multiline: true
            scale:
              label: Badge Scale
              description: Overall size of the badge
              default: 1
              selector:
                number:
                  min: 0.3
                  max: 2
                  step: 0.1
                  mode: slider
            scale_js:
              label: Dynamic Scale (JavaScript)
              description: JavaScript expression for scale
              selector:
                text:
                  multiline: true
            font_scale:
              label: Font Scale
              description: Text size within the badge
              default: 1
              selector:
                number:
                  min: 0.5
                  max: 1.5
                  step: 0.1
                  mode: slider
            font_scale_js:
              label: Dynamic Font Scale (JavaScript)
              description: JavaScript expression for font scale
              selector:
                text:
                  multiline: true
            h_offset:
              label: Horizontal Offset
              description: Fine-tune horizontal position
              default: -4
              selector:
                number:
                  min: -20
                  max: 20
                  step: 1
                  mode: box
            h_offset_js:
              label: Dynamic Horizontal Offset (JavaScript)
              description: JavaScript expression for horizontal offset
              selector:
                text:
                  multiline: true
            v_offset:
              label: Vertical Offset
              description: Fine-tune vertical position
              default: -4
              selector:
                number:
                  min: -20
                  max: 20
                  step: 1
                  mode: box
            v_offset_js:
              label: Dynamic Vertical Offset (JavaScript)
              description: JavaScript expression for vertical offset
              selector:
                text:
                  multiline: true
            # ── Colors ──
            background_color:
              label: Background Color
              description: Badge background color (hex, theme color, or CSS variable)
              selector:
                ui_color: {}
            background_color_js:
              label: Dynamic Background Color (JavaScript)
              description: JavaScript expression for background color
              selector:
                text:
                  multiline: true
            background_color_map:
              label: "Background Color Map (state -> color)"
              description: "Declarative state->background map; '*' = fallback."
              selector:
                object: {}
            background_color_thresholds:
              label: Background Color Thresholds (numeric)
              description: "[[min, color], ...] — e.g. [[0, green], [50, orange], [80, red]]."
              selector:
                object: {}
            text_color:
              label: Text Color
              description: Text color for the badge
              default: "#ffffff"
              selector:
                ui_color: {}
            text_color_js:
              label: Dynamic Text Color (JavaScript)
              description: JavaScript expression for text color
              selector:
                text:
                  multiline: true
            auto_contrast:
              label: Auto-contrast Foreground
              description: "Derive a readable black/white badge text/icon colour from the badge background (any CSS colour, including theme names and var(--...))."
              selector:
                boolean: {}
            show_background:
              label: Show Background
              description: Whether to show the badge background
              default: true
              selector:
                boolean: {}
            # ── Actions ──
            tap_action:
              description: Action when badge is tapped (defaults to more-info if entity exists)
              selector:
                ui_action:
                  default_action: "more-info"
            hold_action:
              label: Hold Action
              description: Action when badge is held
              selector:
                ui_action:
                  default_action: "none"
            # ── Animation ──
            effect:
              label: Animation Effect
              description: Optional animation for the badge. Empty = no animation.
              selector:
                select:
                  options:
                    - label: Pulse
                      value: pulse
                    - label: Glow
                      value: glow
                    - label: Rotate
                      value: rotate
                    - label: Spin
                      value: spin
                    - label: Float
                      value: float
                    - label: Zoom
                      value: zoom
                    - label: Shake
                      value: shake
                    - label: Vibrate
                      value: vibrate
                    - label: Flip
                      value: flip
                    - label: Blink
                      value: blink
                  multiple: false
                  custom_value: false
                  mode: dropdown
            effect_js:
              label: Dynamic Effect (JavaScript)
              description: JavaScript expression for animation effect
              selector:
                text:
                  multiline: true
            effect_speed:
              label: Effect Speed
              description: Animation speed multiplier (2 = twice as fast, 0.5 = half speed).
              selector:
                number:
                  min: 0.1
                  max: 5
                  step: 0.1
                  mode: box
            effect_speed_js:
              label: Dynamic Effect Speed (JavaScript)
              description: JS expression returning the speed multiplier.
              selector:
                text:
                  multiline: true
            glow_color:
              label: Glow Color
              description: Color for glow effect (only works with glow animation)
              selector:
                ui_color: {}
            glow_color_js:
              label: Dynamic Glow Color (JavaScript)
              description: JavaScript expression for glow color
              selector:
                text:
                  multiline: true
            animation:
              label: Raw CSS Animation
              description: >-
                Full CSS animation shorthand, e.g. "my-anim 1s infinite". Define
                the @keyframes in the card's styles block. Overrides Effect.
              warn_if: "item.animation && item.effect"
              warn_text: Raw CSS Animation overrides Animation Effect — Effect is ignored.
              selector:
                text: {}
            animation_js:
              label: Dynamic Raw Animation (JavaScript)
              description: JS expression returning a CSS animation shorthand.
              selector:
                text:
                  multiline: true
            # ── Advanced ──
            title:
              label: Tooltip
              description: Hover tooltip text on the badge (desktop).
              selector:
                text: {}
            title_js:
              label: Dynamic Tooltip (JavaScript)
              description: JS expression returning the tooltip text.
              selector:
                text:
                  multiline: true
          multiple: true
          label_field: name
          description_field: target
    - type: heading
      heading: Advanced
    - name: defaults
      label: Defaults
      description: >-
        Options merged under every entry: defaults.icons applies to all Entries,
        defaults.badges to all Smart Badges. An entry's own value always wins.
        Example: {icons: {decimals: 1, stale_after: 2h}}.
      selector:
        object: {}