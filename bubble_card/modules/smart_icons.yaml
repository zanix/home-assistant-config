          return cardSparkCfgs
            .map(c => {
              const img = SI.sparkImage(c, entity, c.sparkline_scale === 'shared' ? range : null);
              if (!img) return null;
              const h = Math.max(5, Math.min(100, parseFloat(c.sparkline_height) || 35));
              return { img, size: `100% ${h}%` };
            })
            .filter(Boolean)
            .reverse();   // later entries win elsewhere; here that means painting on top
        };

        iconConfigs.forEach(iconConfig => {
          if (iconConfig.target === 'main_icon' && !mainReset) {
            const mc = card.querySelector('.bubble-icon-container');
            if (mc) {
              const ste = mc.querySelector('.smart-icon-text');
              if (ste) { ste.remove(); mc.classList.remove('has-smart-icon-text'); }
              mc.removeAttribute('title');
            }
            mainReset = true;
          }
          if (iconConfig.target !== 'main_icon') {
            const idx = parseInt(iconConfig.target.split('_')[1]);
            if (idx && !resetContainers.has(idx)) {
              const c = getSubContainer(idx);
              if (c) {
                c.style.removeProperty('background-color');
                c.style.removeProperty('opacity');
                c.style.removeProperty('background-image');
                c.removeAttribute('title');
                SI.applyEffect(c, null);
                const ie = c.querySelector('ha-icon');
                if (ie) SI.applyEffect(ie, null);
                const ste = c.querySelector('.smart-icon-text');
                if (ste) { ste.remove(); c.classList.remove('has-smart-icon-text'); }
                const nc = c.querySelector('.bubble-sub-button-name-container');
                if (nc && nc.querySelector('.smart-sub-label')) {
                  nc.replaceChildren();
                  nc.classList.remove('smart-sub-label-2col');
                  delete nc.dataset.smartLabel;
                }
              }
              resetContainers.add(idx);
            }
          }

          if (!iconConfig.name || !shouldShow(iconConfig)) return;

          const ctx = SI.makeCtx(iconConfig, entity);
          const bgResolved = SI.resolveBg(iconConfig, ctx);
          const resolved = {
            icon: SI.evalExpr(iconConfig.icon_js, SI.mapValue(iconConfig.icon_map, ctx.state) ?? SI.thresholdValue(iconConfig.icon_thresholds, ctx.state) ?? iconConfig.icon, ctx),
            iconColor: SI.attrColor(SI.evalExpr(iconConfig.icon_color_js, SI.mapValue(iconConfig.icon_color_map, ctx.state) ?? SI.thresholdValue(iconConfig.icon_color_thresholds, ctx.state) ?? iconConfig.icon_color, ctx), ctx),
            backgroundColor: bgResolved.bg,
            backgroundOpacity: SI.evalExpr(iconConfig.background_opacity_js, iconConfig.background_opacity, ctx),
            iconOpacity: SI.evalExpr(iconConfig.icon_opacity_js, SI.mapValue(iconConfig.icon_opacity_map, ctx.state) ?? SI.thresholdValue(iconConfig.icon_opacity_thresholds, ctx.state) ?? iconConfig.icon_opacity, ctx),
            effect: SI.evalExpr(iconConfig.effect_js, SI.mapValue(iconConfig.effect_map, ctx.state) ?? SI.thresholdValue(iconConfig.effect_thresholds, ctx.state) ?? iconConfig.effect, ctx),
            effectTarget: SI.evalExpr(iconConfig.effect_target_js, iconConfig.effect_target || 'container', ctx),
            effectSpeed: SI.evalExpr(iconConfig.effect_speed_js, iconConfig.effect_speed, ctx),
            rotate: SI.evalExpr(iconConfig.rotate_js, iconConfig.rotate, ctx),
            progress: SI.evalExpr(iconConfig.progress_js, iconConfig.progress, ctx),
            progressColor: SI.attrColor(SI.evalExpr(iconConfig.progress_color_js, iconConfig.progress_color, ctx), ctx),
            title: SI.evalExpr(iconConfig.title_js, iconConfig.title, ctx),
            animation: SI.evalExpr(iconConfig.animation_js, iconConfig.animation, ctx),
            css: SI.evalExpr(iconConfig.css_js, iconConfig.css, ctx),
            text: SI.resolveText(iconConfig, ctx),
            label: SI.resolveLabel(iconConfig, ctx),
            filter: SI.resolveFilter(iconConfig, ctx)
          };
          if (resolved.progress === 'timer') {
            resolved.progress = SI.timerProgress(ctx.entity);
          } else if (typeof resolved.progress === 'string' && resolved.progress.startsWith('attr:')) {
            resolved.progress = ctx.attributes?.[resolved.progress.slice(5)];
          }
          const unavailStyle = SI.flag(iconConfig.unavailable_style);
          if (unavailStyle &&
              (!ctx.entity || ctx.state === 'unavailable' || ctx.state === 'unknown')) {
            const f = unavailStyle === true || unavailStyle === 'grey'
              ? 'grayscale(1) opacity(0.5)'
              : unavailStyle;
            resolved.filter = resolved.filter ? `${resolved.filter} ${f}` : f;
            resolved.title = resolved.title ? `${resolved.title} — unavailable` : 'unavailable';
          }
          const staleAfter = SI.durationS(iconConfig.stale_after);
          if (staleAfter > 0 && ctx.entity) {
            const lu = Date.parse(ctx.entity.last_updated);
            if (!isNaN(lu) && Date.now() - lu > staleAfter * 1000) {
              const f = 'grayscale(1) opacity(0.6)';
              resolved.filter = resolved.filter ? `${resolved.filter} ${f}` : f;
              const ago = SI.helpers.timeAgo(lu);
              resolved.title = resolved.title ? `${resolved.title} — stale (${ago})` : `stale (${ago})`;
            }
          }
          if (iconConfig.auto_contrast && !resolved.iconColor) {
            const fg = SI.contrastFg(bgResolved.raw);
            if (fg) resolved.iconColor = fg;
          }

          if (iconConfig.target === 'card') {
            if (bgResolved.bg) {
              iconStyles.push(`.bubble-button-background, .bubble-background { background-color: ${bgResolved.bg} !important; opacity: 1; }`);
            }
            let cardText = SI.attrColor(SI.evalExpr(iconConfig.text_color_js,
              SI.mapValue(iconConfig.text_color_map, ctx.state) ?? SI.thresholdValue(iconConfig.text_color_thresholds, ctx.state) ?? iconConfig.text_color, ctx), ctx);
            if (!cardText && iconConfig.auto_contrast) cardText = SI.contrastFg(bgResolved.raw);
            if (cardText) {
              iconStyles.push(`.bubble-name, .bubble-state { color: ${SI.processColor(cardText)} !important; }`);
            }
            appliedCardName = SI.applyCardText(card.querySelector('.bubble-name'),
              SI.evalExpr(iconConfig.card_name_js, SI.mapValue(iconConfig.card_name_map, ctx.state) ?? SI.thresholdValue(iconConfig.card_name_thresholds, ctx.state) ?? iconConfig.card_name, ctx)) || appliedCardName;
            appliedCardState = SI.applyCardText(card.querySelector('.bubble-state'),
              SI.resolveStateParts(iconConfig, iconConfig.entity || entity, iconConfig.auto_contrast) ??
              SI.evalExpr(iconConfig.card_state_js, SI.mapValue(iconConfig.card_state_map, ctx.state) ?? SI.thresholdValue(iconConfig.card_state_thresholds, ctx.state) ?? iconConfig.card_state, ctx) ??
              (iconConfig.state_attribute != null ? SI.scalarText(ctx.state) : undefined)) || appliedCardState;
            const bgImage = SI.evalExpr(iconConfig.background_image_js, iconConfig.background_image, ctx);
            if (bgImage) {
              const url = String(bgImage).startsWith('attr:')
                ? ctx.attributes[String(bgImage).slice(5)]
                : bgImage;
              if (url) {
                const blur = parseFloat(iconConfig.background_blur);
                const dim = parseFloat(iconConfig.background_dim);
                const f = [];
                if (!isNaN(blur) && blur > 0) f.push(`blur(${blur}px)`);
                if (!isNaN(dim) && dim > 0) f.push(`brightness(${(1 - Math.max(0, Math.min(1, dim))).toFixed(2)})`);
                iconStyles.push(`.bubble-button-background, .bubble-background { background-image: url("${url}"); background-size: cover; background-position: center; opacity: 1;${f.length ? ` filter: ${f.join(' ')}; scale: 1.08;` : ''} }`);
                if (f.length) containerClipNeeded = true;
              }
            }
            if (SI.sparkEntity(iconConfig, entity)) cardSparkCfgs.push(iconConfig);
            const cardSparks = cardSparkLayers();
            const cardPct = SI.progressPct(iconConfig, resolved.progress);
            const wantFill = iconConfig.progress_style === 'fill' && !isNaN(cardPct);
            if (cardSparks.length && !wantFill) {
              iconStyles.push(`.bubble-button-background, .bubble-background { background-image: ${cardSparks.map(s => s.img).join(', ')}; background-size: ${cardSparks.map(s => s.size).join(', ')}; background-position: bottom; background-repeat: no-repeat; opacity: 1; }`);
            }
            if (SI.sparkEntity(iconConfig, entity) && !SI.sparkImage(iconConfig, entity)) {
              const bgEl = card.querySelector('.bubble-button-background') || card.querySelector('.bubble-background');
              if (bgEl) {
                SI.sparkOnReady(iconConfig, entity, () => {
                  const imgs = cardSparkLayers();
                  if (!imgs.length) return;
                  bgEl.style.backgroundImage = imgs.map(s => s.img).join(', ');
                  bgEl.style.backgroundSize = imgs.map(s => s.size).join(', ');
                  bgEl.style.backgroundPosition = 'bottom';
                  bgEl.style.backgroundRepeat = 'no-repeat';
                  bgEl.style.opacity = 1;
                });
              }
            }
            const borderColor = SI.evalExpr(iconConfig.border_color_js, iconConfig.border_color, ctx);
            const cardGlow = SI.evalExpr(iconConfig.glow_color_js, iconConfig.glow_color, ctx);
            if (borderColor || cardGlow) {
              const parts = [];
              if (borderColor) parts.push(`border: 2px solid ${SI.processColor(borderColor)};`);
              if (cardGlow) parts.push(`box-shadow: 0 0 12px ${SI.processColor(cardGlow)};`);
              iconStyles.push(`.bubble-container { ${parts.join(' ')} }`);
            }
            const accent = SI.attrColor(SI.evalExpr(iconConfig.accent_color_js,
              SI.mapValue(iconConfig.accent_color_map, ctx.state) ?? SI.thresholdValue(iconConfig.accent_color_thresholds, ctx.state) ?? iconConfig.accent_color, ctx), ctx);
            if (accent) {
              const side = ['left', 'right', 'top', 'bottom'].includes(iconConfig.accent_side) ? iconConfig.accent_side : 'left';
              const aw = parseFloat(iconConfig.accent_width);
              iconStyles.push(`.bubble-container { border-${side}: ${isNaN(aw) ? 4 : aw}px solid ${SI.processColor(accent)} !important; }`);
            }
            if (resolved.filter) {
              iconStyles.push(`.bubble-container { filter: ${resolved.filter}; }`);
            }
            const pct = cardPct;
            if (!isNaN(pct)) {
              const pc = SI.progressColor(iconConfig, resolved.progressColor, pct);
              if (iconConfig.progress_style === 'fill') {
                const tc = SI.processColor(iconConfig.progress_track_color) ||
                  'var(--bubble-button-main-background-color, var(--bubble-main-background-color, var(--background-color-2, var(--secondary-background-color))))';
                const layers = SI.fillLayers(iconConfig, pc, pct, tc);
                if (cardSparks.length) {
                  iconStyles.push(`.bubble-button-background, .bubble-background { background-image: ${cardSparks.map(s => s.img).join(', ')}, ${layers.join(', ')}; background-size: ${cardSparks.map(s => s.size).join(', ')}${', 100% 100%'.repeat(layers.length)}; background-position: ${cardSparks.map(() => 'bottom').join(', ')}${', center'.repeat(layers.length)}; background-repeat: no-repeat; }`);
                } else {
                  iconStyles.push(`.bubble-button-background, .bubble-background { background-image: ${layers.join(', ')}; }`);
                }
              } else {
                const tc = SI.processColor(iconConfig.progress_track_color) || 'rgba(127,127,127,0.2)';
                const th = parseFloat(iconConfig.progress_thickness) || 3;
                iconStyles.push(`.bubble-container { position: relative; }`);
                iconStyles.push(`.bubble-container::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: ${th}px; background: linear-gradient(to right, ${pc} ${pct}%, ${tc} ${pct}%); pointer-events: none; z-index: 1; }`);
              }
            }
            if (resolved.css) {
              iconStyles.push(`.bubble-container { ${resolved.css} }`);
            }
            return;
          }

          if (iconConfig.target === 'main_icon') {
            if (resolved.icon && icon.icon !== resolved.icon) icon.icon = resolved.icon;
            if (resolved.iconColor) {
              iconStyles.push(`.bubble-icon { color: ${SI.processColor(resolved.iconColor)} !important; opacity: 1 !important; }`);
            }
            if (resolved.backgroundColor) {
              iconStyles.push(`.bubble-icon-container { background-color: ${resolved.backgroundColor} !important; }`);
            }
            if (resolved.backgroundOpacity !== undefined) {
              iconStyles.push(`.bubble-icon-container { opacity: ${resolved.backgroundOpacity} !important; }`);
            }
            if (resolved.iconOpacity !== undefined) {
              iconStyles.push(`.bubble-icon, .bubble-icon-container .bubble-entity-picture { opacity: ${resolved.iconOpacity} !important; }`);
            }
            if (resolved.animation || resolved.effect) {
              const sel = resolved.effectTarget === 'icon' ? '.bubble-icon' : '.bubble-icon-container';
              const anim = resolved.animation || SI.effectAnimation(resolved.effect, resolved.effectSpeed);
              iconStyles.push(`${sel} { animation: ${anim} !important; }`);
            }
            const mainContainer = card.querySelector('.bubble-icon-container');
            if (mainContainer) {
              SI.applyText(mainContainer, resolved.text ?? null, resolved.iconColor, true, iconConfig.flash_on_change, iconConfig.animate_value);
            }
            if (resolved.filter) {
              iconStyles.push(`.bubble-icon-container .bubble-entity-picture, .bubble-icon-container .bubble-icon { filter: ${resolved.filter} !important; }`);
            }
            const mainRot = parseFloat(resolved.rotate);
            if (!isNaN(mainRot)) {
              iconStyles.push(`.bubble-icon, .bubble-icon-container .bubble-entity-picture { rotate: ${mainRot}deg; transition: rotate 0.3s ease; }`);
            }
            if (resolved.title && mainContainer) mainContainer.title = resolved.title;
            const pct = SI.progressPct(iconConfig, resolved.progress);
            if (!isNaN(pct)) {
              const pc = SI.progressColor(iconConfig, resolved.progressColor, pct);
              const tc = SI.processColor(iconConfig.progress_track_color) || 'rgba(127,127,127,0.25)';
              const th = parseFloat(iconConfig.progress_thickness) || 3;
              iconStyles.push(`.bubble-icon-container::before { content: ''; position: absolute; inset: -4px; border-radius: 50%; background: conic-gradient(${pc} ${pct}%, ${tc} 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - ${th}px), #000 calc(100% - ${th - 0.5}px)); mask: radial-gradient(farthest-side, transparent calc(100% - ${th}px), #000 calc(100% - ${th - 0.5}px)); pointer-events: none; z-index: 1; }`);
            }
            if (resolved.css) {
              iconStyles.push(`.bubble-icon-container { ${resolved.css} }`);
            }
          } else {
            const idx = parseInt(iconConfig.target.split('_')[1]);
            const container = getSubContainer(idx);
            if (resolved.icon && subButtonIcon && subButtonIcon[idx - 1] && subButtonIcon[idx - 1].icon !== resolved.icon) {
              subButtonIcon[idx - 1].icon = resolved.icon;
            }
            if (container) {
              const sb = `.bubble-sub-button-${idx}`;
              if (iconConfig.hide) {
                iconStyles.push(`${sb} { display: none !important; }`);
                return;
              }
              if (resolved.iconColor) {
                const c = SI.processColor(resolved.iconColor);
                iconStyles.push(`${sb} ha-icon, ${sb} ha-attribute-icon, ${sb} ha-state-icon { color: ${c} !important; --mdc-icon-color: ${c} !important; }`);
                if (iconConfig.auto_contrast) {
                  iconStyles.push(`${sb} .bubble-sub-button-name, ${sb} .bubble-sub-button-state, ${sb} .bubble-sub-button-attribute, ${sb} .bubble-sub-button-name-container { color: ${c} !important; }`);
                }
              }
              if (resolved.backgroundColor) {
                container.style.backgroundColor = resolved.backgroundColor;
              }
              if (resolved.backgroundOpacity !== undefined) {
                container.style.opacity = resolved.backgroundOpacity;
              }
              if (resolved.iconOpacity !== undefined) {
                iconStyles.push(`${sb} ha-icon, ${sb} ha-attribute-icon, ${sb} ha-state-icon, ${sb} .bubble-sub-button-image { opacity: ${resolved.iconOpacity} !important; }`);
              }
              if (resolved.animation) {
                SI.applyEffect(container, null);
                const sel = resolved.effectTarget === 'icon'
                  ? `${sb} ha-icon, ${sb} ha-attribute-icon, ${sb} ha-state-icon`
                  : sb;
                iconStyles.push(`${sel} { animation: ${resolved.animation} !important; }`);
              } else if (resolved.effectTarget === 'icon') {
                if (resolved.effect) {
                  iconStyles.push(`${sb} ha-icon, ${sb} ha-attribute-icon, ${sb} ha-state-icon { animation: ${SI.effectAnimation(resolved.effect, resolved.effectSpeed)} !important; }`);
                }
              } else {
                SI.applyEffect(container, resolved.effect, resolved.effectSpeed);
              }
              if (resolved.filter) {
                iconStyles.push(`${sb} .bubble-sub-button-image, ${sb} ha-icon, ${sb} ha-state-icon { filter: ${resolved.filter} !important; }`);
              }
              const rot = parseFloat(resolved.rotate);
              if (!isNaN(rot)) {
                iconStyles.push(`${sb} ha-icon, ${sb} ha-attribute-icon, ${sb} ha-state-icon { rotate: ${rot}deg; transition: rotate 0.3s ease; }`);
              }
              const pct = SI.progressPct(iconConfig, resolved.progress);
              if (!isNaN(pct)) {
                const pc = SI.progressColor(iconConfig, resolved.progressColor, pct);
                if (iconConfig.progress_style === 'fill') {
                  const tc = SI.processColor(iconConfig.progress_track_color) ||
                    'var(--bubble-sub-button-background-color, var(--background-color-2, var(--secondary-background-color)))';
                  iconStyles.push(`${sb} { background-image: ${SI.fillLayers(iconConfig, pc, pct, tc).join(', ')}; }`);
                } else {
                  const tc = SI.processColor(iconConfig.progress_track_color) || 'rgba(127,127,127,0.25)';
                  const th = parseFloat(iconConfig.progress_thickness) || 2.5;
                  iconStyles.push(`${sb} { position: relative; overflow: visible !important; }`);
                  iconStyles.push(`${sb}::before { content: ''; position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(${pc} ${pct}%, ${tc} 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - ${th}px), #000 calc(100% - ${th - 0.5}px)); mask: radial-gradient(farthest-side, transparent calc(100% - ${th}px), #000 calc(100% - ${th - 0.5}px)); pointer-events: none; z-index: 1; }`);
                }
              }
              if (resolved.title) container.title = resolved.title;
              const subSpark = SI.sparkImage(iconConfig, entity);
              if (subSpark) {
                iconStyles.push(`${sb} { background-image: ${subSpark}; background-size: 100% 100%; background-repeat: no-repeat; }`);
              } else if (SI.sparkEntity(iconConfig, entity)) {
                const subEl = container;
                SI.sparkOnReady(iconConfig, entity, () => {
                  const img = SI.sparkImage(iconConfig, entity);
                  if (!img) return;
                  subEl.style.backgroundImage = img;
                  subEl.style.backgroundSize = '100% 100%';
                  subEl.style.backgroundRepeat = 'no-repeat';
                });
              }
              if (resolved.css) {
                iconStyles.push(`${sb} { ${resolved.css} }`);
              }
              SI.applyText(container, resolved.text ?? null, resolved.iconColor, false, iconConfig.flash_on_change, iconConfig.animate_value);
              const nameContainer = container.querySelector('.bubble-sub-button-name-container');
              if (nameContainer && resolved.label) {
                SI.renderLabel(nameContainer, resolved.label, iconConfig.two_column, iconConfig.flash_on_change, iconConfig.animate_value);
              }
            }
          }
        });

        if (!appliedCardName) SI.revertCardText(card.querySelector('.bubble-name'));
        if (!appliedCardState) SI.revertCardText(card.querySelector('.bubble-state'));

        badgeConfigs.forEach(badgeConfig => {
          const badgeKey = `${badgeConfig.target}_${badgeConfig.name}`;
          if (!badgeConfig.name || !badgeConfig.target || !shouldShow(badgeConfig)) {
            const existing = (card.closest('ha-card') || card).querySelector(`[data-badge-key="${badgeKey}"]`);
            if (existing) existing.remove();
            return;
          }

          const entityId = badgeConfig.entity || entity;
          const ctx = SI.makeCtx(badgeConfig, entity);
          const entityObj = ctx.entity;

          const resolved = {
            icon: SI.evalExpr(badgeConfig.icon_js, SI.mapValue(badgeConfig.icon_map, ctx.state) ?? SI.thresholdValue(badgeConfig.icon_thresholds, ctx.state) ?? badgeConfig.icon, ctx),
            text: SI.evalExpr(badgeConfig.text_js,
              SI.mapValue(badgeConfig.text_map, ctx.state) ?? SI.thresholdValue(badgeConfig.text_thresholds, ctx.state) ?? badgeConfig.text, ctx),
            bg: SI.attrColor(SI.evalExpr(badgeConfig.background_color_js,
              SI.mapValue(badgeConfig.background_color_map, ctx.state) ?? SI.thresholdValue(badgeConfig.background_color_thresholds, ctx.state) ?? badgeConfig.background_color, ctx), ctx),
            textColor: SI.attrColor(SI.evalExpr(badgeConfig.text_color_js, badgeConfig.text_color, ctx), ctx),
            scale: SI.evalExpr(badgeConfig.scale_js, badgeConfig.scale, ctx),
            fontScale: SI.evalExpr(badgeConfig.font_scale_js, badgeConfig.font_scale, ctx),
            glow: SI.evalExpr(badgeConfig.glow_color_js, badgeConfig.glow_color, ctx),
            hOffset: SI.evalExpr(badgeConfig.h_offset_js, badgeConfig.h_offset ?? -4, ctx),
            vOffset: SI.evalExpr(badgeConfig.v_offset_js, badgeConfig.v_offset ?? -4, ctx),
            position: SI.evalExpr(badgeConfig.position_js, badgeConfig.position || 'top-right', ctx),
            shape: SI.evalExpr(badgeConfig.shape_js, badgeConfig.shape || 'auto', ctx),
            effect: SI.evalExpr(badgeConfig.effect_js, badgeConfig.effect, ctx),
            effectSpeed: SI.evalExpr(badgeConfig.effect_speed_js, badgeConfig.effect_speed, ctx),
            title: SI.evalExpr(badgeConfig.title_js, badgeConfig.title, ctx),
            animation: SI.evalExpr(badgeConfig.animation_js, badgeConfig.animation, ctx),
            showBg: badgeConfig.show_background,
            entityValue: entityId ? (
              badgeConfig.attribute
                ? (SI.formatAttr(badgeConfig.attribute === 'state'
                    ? entityObj?.state
                    : entityObj?.attributes[badgeConfig.attribute], badgeConfig) ?? '')
                : (entityObj ? hass.formatEntityState?.(entityObj) || entityObj.state || '' : '')
            ) : null
          };
          if (badgeConfig.auto_contrast && !resolved.textColor) {
            resolved.textColor = SI.contrastFg(resolved.bg);
          }

          const container = badgeConfig.target === 'main_icon'
            ? card.querySelector('.bubble-icon-container')
            : badgeConfig.target === 'card'
              ? (card.closest('ha-card') || card.querySelector('.bubble-container'))
              : getSubContainer(parseInt(badgeConfig.target.split('_')[1]));
          if (!container) return;

          if (container.style.position === 'static' || !container.style.position) {
            container.style.position = 'relative';
          }

          let badge = container.querySelector(`[data-badge-key="${badgeKey}"]`);
          if (!badge) {
            badge = document.createElement('div');
            badge.setAttribute('data-badge-key', badgeKey);
            container.appendChild(badge);
          }

          const hasActions = !!(badgeConfig.tap_action || badgeConfig.hold_action || badgeConfig.entity);
          let actionEnabled = false;
          if (hasActions) {
            const actionEntity = badgeConfig.entity || entity;
            const tapAction = badgeConfig.tap_action
              ? { ...badgeConfig.tap_action, entity: badgeConfig.tap_action.entity || actionEntity }
              : actionEntity
                ? { action: 'more-info', entity: actionEntity }
                : { action: 'none' };
            const holdAction = badgeConfig.hold_action
              ? { ...badgeConfig.hold_action, entity: badgeConfig.hold_action.entity || actionEntity }
              : { action: 'none' };
            actionEnabled = tapAction.action !== 'none' || holdAction.action !== 'none';
            badge.dataset.entity = actionEntity;
            const tapJson = JSON.stringify(tapAction);
            if (badge.dataset.tapAction !== tapJson) badge.dataset.tapAction = tapJson;
            if (!badge.dataset.doubleTapAction) badge.dataset.doubleTapAction = JSON.stringify({ action: 'none' });
            const holdJson = JSON.stringify(holdAction);
            if (badge.dataset.holdAction !== holdJson) badge.dataset.holdAction = holdJson;
          }

          const pic = badgeConfig.show_entity_picture ? entityObj?.attributes?.entity_picture : null;

          const classes = ['bubble-main-icon-badge', `position-${resolved.position}`];
          if (resolved.shape === 'circle' || (resolved.shape === 'auto' && (resolved.icon || pic))) classes.push('circular');
          if (resolved.showBg === false) classes.push('no-background');
          if (hasActions) {
            classes.push('bubble-action');
            if (actionEnabled) classes.push('bubble-action-enabled');
          } else {
            classes.push('no-actions');
          }
          if (resolved.effect && !resolved.animation) classes.push(`smart-effect-${resolved.effect}`);
          if (badgeConfig.flash_on_change && badge.classList.contains('smart-flash')) classes.push('smart-flash');
          const className = classes.join(' ');
          if (badge.className !== className) badge.className = className;

          if (resolved.bg) badge.style.setProperty('--badge-color', SI.processColor(resolved.bg, ctx));
          else badge.style.removeProperty('--badge-color');
          if (resolved.textColor) badge.style.color = SI.processColor(resolved.textColor, ctx);
          else badge.style.removeProperty('color');
          if (resolved.glow) badge.style.setProperty('--glow-color', SI.processColor(resolved.glow, ctx));
          else badge.style.removeProperty('--glow-color');

          const defaultScale = badgeConfig.target.startsWith('button_') ? 0.7 : 1;
          badge.style.setProperty('--badge-scale', resolved.scale ?? defaultScale);

          if (resolved.fontScale && resolved.fontScale !== 1) badge.style.fontSize = `${resolved.fontScale}em`;
          else badge.style.removeProperty('font-size');

          if (resolved.animation) {
            if (badge.style.animation !== resolved.animation) badge.style.animation = resolved.animation;
          } else if (badge.style.animation) {
            badge.style.removeProperty('animation');
          }

          if (resolved.title) badge.title = resolved.title;
          else badge.removeAttribute('title');

          const dur = SI.effectDuration(resolved.effect, resolved.effectSpeed);
          if (dur) badge.style.animationDuration = dur;
          else badge.style.removeProperty('animation-duration');

          badge.style.top = ''; badge.style.bottom = '';
          badge.style.left = ''; badge.style.right = '';
          if (resolved.position === 'top' || resolved.position === 'bottom') {
            badge.style.marginTop = resolved.position === 'top' ? `${resolved.vOffset}px` : '';
            badge.style.marginBottom = resolved.position === 'bottom' ? `${resolved.vOffset}px` : '';
          } else {
            badge.style.marginTop = ''; badge.style.marginBottom = '';
            const [vSide, hSide] = resolved.position.split('-');
            badge.style[vSide] = `${resolved.vOffset}px`;
            badge.style[hSide] = `${resolved.hOffset}px`;
          }

          if (pic) {
            if (badge.dataset.pic !== pic) {
              badge.dataset.pic = pic;
              delete badge.dataset.iconName;
              const img = document.createElement('img');
              img.className = 'badge-img';
              img.src = pic;
              badge.replaceChildren(img);
            }
          } else if (resolved.icon) {
            if (badge.dataset.pic) delete badge.dataset.pic;
            if (badge.dataset.iconName !== resolved.icon) {
              badge.dataset.iconName = resolved.icon;
              const ic = document.createElement('ha-icon');
              ic.className = 'badge-icon';
              ic.setAttribute('icon', resolved.icon);
              badge.replaceChildren(ic);
            }
          } else {
            if (badge.dataset.pic) delete badge.dataset.pic;
            if (badge.dataset.iconName) delete badge.dataset.iconName;
            const content = String(resolved.text || resolved.entityValue || '');
            const tweenBusy = badge.dataset.tweenTarget === content && SI.tweens.has(badge);
            if (badge.textContent !== content && !tweenBusy) {
              if (badgeConfig.animate_value && badge.textContent) {
                badge.dataset.tweenTarget = content;
                SI.tweenText(badge, badge.textContent, content);
              } else {
                badge.textContent = content;
                badge.dataset.tweenTarget = content;
              }
              if (badgeConfig.flash_on_change) {
                badge.classList.remove('smart-flash');
                void badge.offsetWidth;
                badge.classList.add('smart-flash');
              }
            }
          }
        });

        if (badgeConfigs.length && !containerClipNeeded &&
            !card.querySelector('.bubble-range-fill')) {
          iconStyles.push('.bubble-container { overflow: visible; }');
        }

        return iconStyles.join('\n');

      } catch (err) {
        console.error("[smart_icons] Error:", err);
        return '';
      }
    })()}

