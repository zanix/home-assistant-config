smart_icons:
  name: "Smart Icons"
  version: "1.11.3"
  creator: "Zsolt"
  link: "https://github.com/Clooos/Bubble-Card/discussions/1750"

  supported:
    - button
    - calendar
    - climate
    - cover
    - media-player
    - select
    - pop-up
    - separator

  description: |
    Declarative, state-driven styling for Bubble Card: icons, colors, text, badges and whole-card looks — no JS required, JS available everywhere.<br>
    Smart Icons watches your entities and restyles a Bubble Card live: swap icons and colors by state, show a value inside the icon circle, overlay badges, replace the card's name/state lines, draw progress fills and history sparklines on the whole card. Everything is configurable from the GUI editor or YAML.<br>
    <br><b>Optional: a richer editor</b><br>
    The plain flat editor works everywhere and isn't going anywhere. For a nicer UI there's an <b>optional</b> companion resource, <a href="https://github.com/szsolt/bubble-card-editor-extension" target="_blank" rel="noopener">Bubble Card Editor</a>, that renders the fields organised: collapsible groups, live-preview JS inputs, ordered chip lists, and structured row editors for the map/threshold settings — all on <b>stock Bubble Card</b>, no fork or patch. Install it via HACS (Custom repositories → category "Dashboard") and add it as a resource alongside Bubble Card; Smart Icons picks it up automatically. Skip it and nothing changes.<br>
    <br><b>How it works — read this first</b><br>
    <ul>
    <li>You add entries to two lists: <b>icons:</b> (styles an icon, a sub-button or the whole card) and <b>badges:</b> (overlay pills with their own content and actions).</li>
    <li>Every entry needs a unique <b>name</b> and a <b>target</b>: <code>main_icon</code>, <code>button_1</code>..<code>button_4</code>, or <code>card</code> (the whole card). <code>targets: [button_1, button_2]</code> applies one entry to several targets. Everything else is optional — set only what you need.</li>
    <li><b>entity</b> defaults to the card's own entity; set it to react to a different one.</li>
    <li>Almost every visual option is a 4-arm family, pick ONE arm: <code>option: value</code> (static) · <code>option_map: {state1: value, '*': fallback}</code> (state lookup) · <code>option_thresholds: [[min, value], ...]</code> (numeric stops, highest stop ≤ state wins) · <code>option_js: "expression"</code> (JavaScript). Priority when several are set: <code>_js</code> > <code>_map</code> > <code>_thresholds</code> > static.</li>
    <li><b>conditions:</b> (HA condition list) and <b>condition_js:</b> gate the whole entry — it applies only while they match, and reverts cleanly when they stop.</li>
    <li><b>state_attribute:</b> <code>hvac_action</code> — this entry's <code>state</code> becomes that attribute: every map/threshold/condition keys on it with plain keys (no JS). The raw state stays on <code>entity.state</code>. On a <code>card</code> target with no <code>card_state*</code> arm set, the state line shows this attribute instead of the native state.</li>
    <li><b>defaults:</b> <code>{icons: {...}, badges: {...}}</code> at module level merges shared options under every entry (entry values win).</li>
    </ul>
    <br><b>Icon</b><br>
    <ul>
    <li><code>icon</code> / <code>icon_map</code> / <code>icon_thresholds</code> / <code>icon_js</code> — replace the mdi glyph by state</li>
    <li><code>icon_color</code> (+ arms) — glyph color; <code>attr:rgb_color</code> reads a color from an attribute (<code>[r,g,b]</code> arrays auto-convert)</li>
    <li><code>icon_opacity</code> (+ arms) — fade the glyph/picture only, independent of the container</li>
    <li><code>background_color</code> (+ arms), <code>background_opacity</code> (+ <code>_js</code>) — the icon circle behind it</li>
    <li><code>auto_contrast: true</code> — derive a readable black/white foreground from the background (any CSS color except <code>var(--...)</code>)</li>
    <li><code>rotate</code> / <code>rotate_js</code> — degrees; composes with effects (wind direction from an attribute)</li>
    <li><code>filter</code> (+ arms) — CSS filter on glyph/entity picture; bare keywords expand (<code>grayscale</code> → <code>grayscale(1)</code>, blur, sepia, invert, brightness); e.g. grey out a person photo when away</li>
    </ul>
    <br><b>Text as icon (main icon or sub-buttons)</b><br>
    <ul>
    <li><code>text: "Auto"</code> / <code>text_map</code> / <code>text_thresholds</code> / <code>text_js</code> — show text instead of the glyph; font auto-fits</li>
    <li><code>attribute: current_temperature</code> — declarative shorthand; <code>"state"</code> shows the entity state</li>
    <li>Formatting pipeline on any attribute value: <code>decimals</code>, <code>multiply</code> (100 = fraction → percent), <code>format</code> (<code>duration</code> "1h 5m" · <code>clock</code> "14:05" · <code>percent</code> · <code>power</code> — W auto-scales to kW), <code>prefix</code>, <code>suffix</code>, <code>pair_attribute</code> (+ <code>pair_separator</code>) for "21°/23°"</li>
    <li><code>animate_value: true</code> — numeric values roll old → new (400ms tween)</li>
    <li><code>flash_on_change: true</code> — one-shot pulse when the displayed value changes</li>
    </ul>
    <br><b>Sub-button value/label</b><br>
    <ul>
    <li><code>label_value: "42%"</code> / <code>label_value_js</code> — replaces the sub-button's name line</li>
    <li><code>label_attribute: current_temperature</code> — value from an attribute (same formatting pipeline)</li>
    <li><code>label: "ETA"</code> — static label next to the value; <code>two_column: true</code> = value-left / dimmed-label-right grid</li>
    <li><code>hide: true</code> — hide the sub-button entirely while the entry's conditions match</li>
    </ul>
    <br><b>Card text (target: card)</b><br>
    <ul>
    <li><code>card_name</code> / <code>card_state</code> (+ arms) — replace the card's name and state/subtitle lines; helpers like <code>fmt()</code>/<code>timeAgo()</code>/<code>cond()</code> in the subtitle, no template sensors. A returned array or embedded <code>\n</code> renders multi-line — size the card with Bubble's <code>card_layout: large</code> + <code>rows: N</code> (fractions allowed). Long text scrolls (with <code>scrolling_effect</code>, on by default). Reverts to Bubble's text when conditions stop matching; an override on a hidden state line unhides it.</li>
    <li>Keep <code>show_name</code> / <code>show_state: true</code> for the line you override (their defaults: name yes, state only on <code>button_type: state</code>). Bubble always builds both elements, but <code>show_*</code> is what lays them out and keeps them visible — overriding a line you've set <code>false</code> makes Smart Icons fight Bubble's hiding for no gain. Think of <code>show_*</code> as "let Bubble render this line", the override as "and here's what it says".</li>
    <li><code>card_state_parts</code> — compose the state line from multiple values, zero JS: each named part pulls a state/attribute from any entity, runs the formatting pipeline and has its own <code>text_color</code> + <code>background_color</code> arm families keyed on the part's RAW value; a background renders the part as an inline chip (<code>auto_contrast</code> keeps chip text readable). Each part's span carries class <code>si-part-NAME</code> for custom CSS.</li>
    <li><code>card_state_format: "{temp}° · H {hum}% — {action}"</code> — f-string layout for the parts (<code>{{</code> <code>}}</code> escape braces, <code>\n</code> = multi-line); omit it and parts join with <code>card_state_separator</code> (default <code>' · '</code>).</li>
    <li><code>text_color</code> (+ arms) — color for the card's name/state lines.</li>
    </ul>
    <br><b>Card styling (target: card)</b><br>
    <ul>
    <li><code>border_color</code> (+ <code>_js</code>) — 2px card border; <code>glow_color</code> (+ <code>_js</code>) — box-shadow glow</li>
    <li><code>accent_color</code> (+ arms), <code>accent_side: left/right/top/bottom</code>, <code>accent_width</code> — edge accent stripe (presence borders, severity edges)</li>
    <li><code>background_image</code> (+ <code>_js</code>), <code>background_blur</code>, <code>background_dim</code> — card background image from a URL or <code>attr:entity_picture</code> (album art, camera, person photo)</li>
    <li><code>filter</code> (+ arms) — CSS filter on the whole card</li>
    </ul>
    <br><b>Progress (ring on icons, bar or fill on the card / sub-buttons)</b><br>
    <ul>
    <li><code>progress:</code> 0-100 number, the word <code>timer</code> (live ring from a timer entity), <code>attr:KEY</code> (e.g. <code>attr:brightness</code>), or <code>progress_js</code></li>
    <li><code>progress_min</code> / <code>progress_max</code> — map any sensor range onto 0-100 (<code>attr:brightness</code> + <code>progress_max: 255</code>)</li>
    <li>target <code>main_icon</code> / round sub-buttons → conic ring; target <code>card</code> → thin bottom bar, or <code>progress_style: fill</code> = the whole card/sub-button background fills with the percentage</li>
    <li><code>progress_direction: right/left/up/down</code> (fill style; vertical = tank levels); <code>progress_thickness</code> — ring band width / bar height</li>
    <li><code>progress_color</code> — fixed color, <code>auto</code> (red → orange → green by percentage), <code>progress_color_stops: [[0,'#hex'],...]</code> custom ramp, or a raw CSS gradient string (fill style) revealed as it grows; <code>progress_track_color</code> — the unfilled rest</li>
    </ul>
    <br><b>Sparkline (ghost history chart)</b><br>
    <ul>
    <li><code>sparkline: true</code> — area chart of the entry's entity along the card bottom (target: card) or as the sub-button background; throttled history fetch, no extra DOM</li>
    <li><code>sparkline_entity</code> — chart a different entity's history</li>
    <li><code>sparkline_hours</code> (default 24), <code>sparkline_color</code> (any CSS color — theme names and <code>var(--x)</code> are resolved to a concrete hex before the chart is built), <code>sparkline_opacity</code> (default 0.3)</li>
    <li>Multiple card-level sparklines overlay: every <code>target: card</code> entry with a sparkline adds a layer (one entity + color per entry, later entries on top) — as many curves as you like</li>
    <li><code>sparkline_scale</code> — what the y-range is: <code>own</code> (default) stretches each curve to its own min/max; <code>shared</code> = one joint range across the card's shared curves, so overlaid temps are comparable; <code>fixed</code> = <code>sparkline_min</code> / <code>sparkline_max</code> (0–100 for percentages; out-of-range values flatten against the chart edge, an empty end falls back to the data's own)</li>
    <li><code>sparkline_height</code> — % of the card height the chart band occupies (default 35, 100 = full height), per entry</li>
    <li><code>sparkline_refresh</code> — history re-fetch interval, seconds or a duration string (<code>15m</code>, <code>2h</code>); default auto = one chart bucket (window ÷ 60, at least 5 min)</li>
    <li><code>sparkline_style</code> — <code>area</code> (default flat fill), <code>gradient</code> (fill fading to transparent at the bottom), <code>line</code> (stroke only; opacity defaults to 0.8)</li>
    <li><code>sparkline_smooth: true</code> — smooth curve instead of straight segments</li>
    <li><code>sparkline_agg</code> — bucket aggregation: <code>mean</code> (default, averages spikes away), <code>max</code> / <code>min</code> (preserve peaks / dips — kettle spikes on a power chart), <code>last</code></li>
    <li>Composes with progress fill: the chart layers on top of the fill</li>
    </ul>
    <br><b>Animation</b><br>
    <ul>
    <li><code>effect</code> (+ arms) — pulse, glow, rotate, spin, float, zoom, shake, vibrate, flip, blink</li>
    <li><code>effect_speed</code> (+ <code>_js</code>) — speed multiplier; <code>effect_target:</code> <code>container</code> (badges animate along, default) or <code>icon</code></li>
    <li><code>animation</code> / <code>animation_js</code> — raw CSS animation shorthand, define your own <code>@keyframes</code> in the card's styles block (overrides effect)</li>
    <li><code>css</code> / <code>css_js</code> — per-target scoped CSS escape hatch (icon circle / sub-button / whole card)</li>
    </ul>
    <br><b>Freshness and availability</b><br>
    <ul>
    <li><code>stale_after: 600</code> — auto-grey + "stale (23m)" tooltip when <code>last_updated</code> is older than N seconds</li>
    <li><code>unavailable_style: grey</code> — auto-grey + tooltip when the entity is unavailable/unknown/missing (<code>true</code>/<code>grey</code> = preset, or any raw CSS filter)</li>
    <li><code>title</code> / <code>title_js</code> — hover tooltip on icons, sub-buttons and badges</li>
    </ul>
    <br><b>Badges</b><br>
    <ul>
    <li>Content: <code>icon</code> (+ arms), <code>text_js</code> / <code>text_map</code> / <code>text_thresholds</code>, or <code>attribute</code> + the same formatting pipeline as icons; <code>show_entity_picture: true</code> = round avatar badge</li>
    <li>Placement: <code>position</code> (6 spots: top/bottom × left/center/right, + <code>_js</code>), <code>target: card</code> = corner badge on the whole card (use positive <code>h_offset</code>/<code>v_offset</code> there)</li>
    <li>Look: <code>shape</code> auto/circle/rounded, <code>scale</code>, <code>font_scale</code>, <code>background_color</code> (+ arms), <code>text_color</code> (+ <code>_js</code>), <code>auto_contrast</code>, <code>show_background</code>, <code>effect</code> + <code>effect_speed</code>, <code>glow_color</code>, <code>animation</code>, <code>animate_value</code>, <code>flash_on_change</code></li>
    <li>Actions: badges with an entity are tappable by default (tap = more-info). Override with <code>tap_action</code> / <code>hold_action</code>: more-info, toggle, call-service, navigate, url, none</li>
    <li><code>conditions</code> / <code>condition_js</code> gate each badge like icon entries</li>
    </ul>
    <br><b>JavaScript expressions</b><br>
    Any <code>*_js</code> field evaluates with this context:<br>
    <ul>
    <li><code>state</code>, <code>lowerState</code>, <code>entity</code>, <code>attributes</code> — the entry's entity (<code>state_attribute</code> redirects <code>state</code>)</li>
    <li><code>secondary</code> / <code>secondaryState</code> / <code>secondaryAttributes</code> — the <code>secondary_entity</code>, for cross-entity logic</li>
    <li><code>states(entityId)</code>, <code>getEntity(entityId)</code>, <code>attr(entityId, attribute)</code> — reach any entity</li>
    <li><code>Math</code>, <code>Date</code>, <code>parseInt</code>, <code>parseFloat</code></li>
    </ul>
    Helper functions:<br>
    <ul>
    <li><code>cond(value, {key: result}, fallback, op='===')</code> — conditional mapping</li>
    <li><code>thresholds(value, {threshold: result}, fallback, op='>=')</code> — ordered numeric stops</li>
    <li><code>entityCond(entityId, conditions, fallback, {attr, op})</code> — condition on another entity</li>
    <li><code>between(value, min, max)</code>, <code>above(value, t)</code>, <code>below(value, t)</code>, <code>equals(value, t)</code>, <code>inSet(value, [a, b])</code></li>
    <li><code>gradient(value, min, max, colorA, colorB)</code> or <code>gradient(value, [[15,'red'],...])</code> — color blend; any CSS color (theme names, <code>var(--x)</code>, named, <code>rgb()</code>/<code>hsl()</code>, hex) is resolved to a concrete hex at call time</li>
    <li><code>fmt(value, {decimals, format, multiply, prefix, suffix})</code> — the formatting pipeline, callable</li>
    <li><code>timeAgo(ts)</code> / <code>timeUntil(ts)</code> — 'now'/'5m'/'3h'/'2d' from e.g. <code>entity.last_changed</code> (live)</li>
    <li><code>trend(entityId, threshold=0)</code> / <code>delta(entityId)</code> — 'up'/'down'/'flat' and the numeric change vs the previous distinct value (session-scoped)</li>
    <li><code>heldFor(entityId, seconds)</code> — true when the state has been unchanged ≥ N s (anti-flap)</li>
    <li><code>countStates(pattern, state='on')</code> — count entities by state; array or <code>'*'</code> wildcard: <code>countStates('light.kitchen_*')</code></li>
    <li><code>batteryIcon(level, charging=false)</code>, <code>getWeatherIcon(condition)</code>, <code>slugify(string)</code></li>
    </ul>
    <br><b>Quick start</b><br>
    Thermostat icon + state colors, one badge — all declarative:<br>
    <code-block><pre>
    smart_icons:
      icons:
        - name: hvac
          target: main_icon
          entity: climate.living_room
          state_attribute: hvac_action
          icon_map: {heating: mdi:fire, cooling: mdi:snowflake, '*': mdi:thermostat}
          icon_color_map: {heating: '#ff9800', cooling: '#03a9f4', '*': '#9e9e9e'}
      badges:
        - name: temp
          target: main_icon
          entity: climate.living_room
          attribute: current_temperature
          decimals: 0
          suffix: '°'
          background_color_thresholds: [[0, '#03a9f4'], [22, '#4caf50'], [26, '#f44336']]
    </pre></code-block>
    <br><b>Whole-card styling examples</b><br>
    Fills, sparklines, accents, background photos — zero JS:<br>
    <code-block><pre>
    smart_icons:
      icons:
        # Power reading as the icon: the number tweens on change, color steps by wattage.
        - name: power
          target: main_icon
          entity: sensor.fridge_power
          attribute: state
          decimals: 0
          animate_value: true
          icon_color_thresholds: [[0, '#4caf50'], [5, '#ff9800'], [50, '#f44336']]

        # 24h temperature ghost chart along the card's bottom edge.
        - name: history
          target: card
          entity: sensor.living_room_temperature
          sparkline: true
          sparkline_color: '#03a9f4'
          sparkline_opacity: 0.35

        # Whole-card brightness fill: gradient revealed left-to-right.
        - name: brightness_fill
          target: card
          entity: light.living_room
          progress: attr:brightness
          progress_max: 255
          progress_style: fill
          progress_color: "linear-gradient(to right, #2196f3, #9c27b0)"

        # Presence accent stripe on the card's left edge.
        - name: presence_edge
          target: card
          entity: person.alice
          accent_color_map: {home: '#4caf50', not_home: '#f44336', '*': '#2196f3'}

        # Blurred, dimmed photo as the card background; grey it out while away.
        - name: photo_bg
          target: card
          entity: person.alice
          background_image: attr:entity_picture
          background_blur: 6
          background_dim: 0.4
          filter_map: {not_home: 'grayscale(1)', '*': ''}

        # Timer countdown ring around the icon, color follows the percentage.
        - name: timer_ring
          target: main_icon
          entity: timer.laundry
          progress: timer
          progress_color: auto

        # Hide a sub-button entirely while guest mode is on.
        - name: hide_when_on
          target: button_2
          entity: switch.guest_mode
          hide: true
          condition_js: "state === 'on'"
    </pre></code-block>
    <br><b>Card text examples</b><br>
    Live multi-line subtitles and multi-value colored state lines:<br>
    <code-block><pre>
    smart_icons:
      icons:
        # Replace the card's name/state: a live two-line subtitle from one expression.
        # Size the card with Bubble's card_layout: large + rows: 1.5 (fractions allowed).
        - name: card_text
          target: card
          entity: climate.living_room
          card_name: Living Room
          card_state_js: >-
            [attributes.current_temperature + ' °C → ' + attributes.temperature + ' °C',
             attributes.hvac_action + ' • updated ' + timeAgo(entity.last_updated)]

        # Multi-value colored state line, zero JS: each part formats and colors
        # itself (arms key on the part's RAW value), the f-string lays them out.
        # A background_color renders an inline chip; auto_contrast keeps it readable.
        - name: climate_readout
          target: card
          entity: climate.living_room
          auto_contrast: true
          card_state_parts:
            - name: temp
              attribute: current_temperature
              decimals: 1
              suffix: '°'
              text_color_thresholds: [[0, '#03a9f4'], [22, '#4caf50'], [26, '#ff9800']]
            - name: hum
              entity: sensor.living_room_humidity
              decimals: 0
              prefix: 'H '
              suffix: '%'
            - name: action
              attribute: hvac_action
              background_color_map: {heating: '#ff9800', cooling: '#03a9f4', '*': 'rgba(127,127,127,0.3)'}
          card_state_format: "{temp} · {hum} — {action}"
    </pre></code-block>
    Release history: see the CHANGELOG in the repo / discussion thread.<br>

  code: |
    .bubble-main-icon-badge {
      position: absolute;
      min-width: 18px;
      height: 16px;
      border-radius: 8px;
      background-color: var(--badge-color, var(--primary-color));
      color: white;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      z-index: 1;
      box-sizing: border-box;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      scale: var(--badge-scale, 1);
      transform-origin: center;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      transition: scale 0.1s ease, opacity 0.1s ease;
    }

    .bubble-main-icon-badge:active {
      scale: calc(var(--badge-scale, 1) * 0.95);
    }

    .bubble-main-icon-badge:hover {
      opacity: 0.9;
    }

    .bubble-main-icon-badge.no-background {
      background-color: transparent;
      box-shadow: none;
    }

    .bubble-main-icon-badge.no-actions {
      pointer-events: none;
      cursor: default;
    }

    .bubble-main-icon-badge.no-actions:active,
    .bubble-main-icon-badge.no-actions:hover {
      scale: var(--badge-scale, 1);
      opacity: 1;
    }

    .bubble-main-icon-badge.circular {
      min-width: 20px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      padding: 0;
      font-size: 10px;
    }

    .bubble-main-icon-badge .badge-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 13px;
      height: 13px;
      --mdc-icon-size: 13px;
    }

    .bubble-main-icon-badge.circular .badge-icon {
      width: 12px;
      height: 12px;
      --mdc-icon-size: 12px;
    }

    .bubble-main-icon-badge .badge-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .bubble-main-icon-badge.position-top-left { top: 0; left: 0; }
    .bubble-main-icon-badge.position-top { top: 0; left: 50%; translate: -50%; }
    .bubble-main-icon-badge.position-top-right { top: 0; right: 0; }
    .bubble-main-icon-badge.position-bottom-left { bottom: 0; left: 0; }
    .bubble-main-icon-badge.position-bottom { bottom: 0; left: 50%; translate: -50%; }
    .bubble-main-icon-badge.position-bottom-right { bottom: 0; right: 0; }

    .bubble-icon-container { overflow: visible !important; position: relative; }
    .bubble-icon-container::after { border-radius: 100%; }

    /* Text-as-icon (smart_icons main_icon text / text_js / attribute).
       Hides the mdi glyph and centers text in the icon circle. Font size is
       set inline (px) from the measured icon size; the var() is a fallback. */
    .bubble-icon-container.has-smart-icon-text .bubble-icon,
    .bubble-icon-container.has-smart-icon-text .bubble-main-icon {
      display: none !important;
    }
    /* Same, but for a sub-button rendering text instead of its glyph. */
    .has-smart-icon-text .bubble-sub-button-icon,
    .has-smart-icon-text ha-icon,
    .has-smart-icon-text ha-state-icon,
    .has-smart-icon-text ha-attribute-icon {
      display: none !important;
    }
    [class*="bubble-sub-button-"].has-smart-icon-text {
      position: relative;
    }
    /* Sub-button label/value (smart_icons label_value / label). The module
       overwrites the name-container content with a .smart-sub-label span.
       two_column lays value-left / dimmed-label-right. */
    .smart-sub-label {
      width: 100%;
      white-space: normal;
      line-height: 1.1;
    }
    /* Bubble gives sub-buttons a fixed height; a wrapped label/value must
